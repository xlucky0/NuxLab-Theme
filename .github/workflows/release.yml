name: Release packages

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai

jobs:
  metadata:
    name: Resolve release version
    runs-on: ubuntu-24.04
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
      apk_version: ${{ steps.version.outputs.apk_version }}
      package_release: ${{ steps.version.outputs.package_release }}
      apk_i18n_version: ${{ steps.version.outputs.apk_i18n_version }}
      docs_branch: ${{ steps.branch.outputs.name }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve release version
        id: version
        run: python3 .github/scripts/release_metadata.py "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Select documentation branch
        id: branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          printf 'name=%s\n' "$DEFAULT_BRANCH" >> "$GITHUB_OUTPUT"

  checks:
    uses: ./.github/workflows/check.yml

  build:
    name: Build ${{ matrix.package_format }} packages
    needs: [checks, metadata]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      apk_fingerprint: ${{ steps.sign-apk-artifacts.outputs.fingerprint }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - package_format: apk
            sdk_base_url: https://downloads.openwrt.org/releases/25.12.5/targets/x86/64
            sdk_pattern: openwrt-sdk-25.12.5-x86-64_.*Linux-x86_64.tar.zst

    steps:
      - name: Checkout theme
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo -E apt-get update
          sudo -E apt-get install -y \
            build-essential \
            bison \
            clang \
            curl \
            file \
            flex \
            g++ \
            g++-multilib \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            python3-venv \
            rsync \
            unzip \
            wget \
            xz-utils \
            zlib1g-dev \
            zstd

      - name: Resolve OpenWrt SDK metadata
        id: sdk
        env:
          SDK_BASE_URL: ${{ matrix.sdk_base_url }}
          SDK_PATTERN: ${{ matrix.sdk_pattern }}
        run: |
          checksums="$(mktemp)"
          trap 'rm -f "${checksums}"' EXIT
          curl --http1.1 -fsSL --retry 5 --retry-all-errors \
            --connect-timeout 30 --max-time 120 \
            "${SDK_BASE_URL}/sha256sums" -o "${checksums}"

          sdk_line="$(
            grep -E "[[:space:]]+\\*?${SDK_PATTERN}$" "${checksums}" |
              head -n 1
          )"

          if [ -z "${sdk_line}" ]; then
            echo "::error::Unable to find SDK matching '${SDK_PATTERN}' at ${SDK_BASE_URL}."
            exit 1
          fi

          sdk_sha256="$(printf '%s\n' "${sdk_line}" | awk '{print $1}')"
          sdk_file="$(printf '%s\n' "${sdk_line}" | awk '{print $2}' | sed 's/^\*//')"

          echo "sdk_file=${sdk_file}" >> "${GITHUB_OUTPUT}"
          echo "sdk_sha256=${sdk_sha256}" >> "${GITHUB_OUTPUT}"
          echo "sdk_cache_key=openwrt-sdk-${{ matrix.package_format }}-${sdk_sha256}" >> "${GITHUB_OUTPUT}"

      - name: Cache OpenWrt SDK archive
        id: cache-sdk
        uses: actions/cache@v6
        with:
          path: .cache/openwrt-sdk/${{ steps.sdk.outputs.sdk_file }}
          key: ${{ steps.sdk.outputs.sdk_cache_key }}

      - name: Download OpenWrt SDK
        env:
          SDK_BASE_URL: ${{ matrix.sdk_base_url }}
          SDK_FILE: ${{ steps.sdk.outputs.sdk_file }}
          SDK_SHA256: ${{ steps.sdk.outputs.sdk_sha256 }}
        run: |
          mkdir -p .cache/openwrt-sdk
          sdk_archive=".cache/openwrt-sdk/${SDK_FILE}"
          sdk_partial="${sdk_archive}.part"
          trap 'rm -f "${sdk_partial}"' EXIT

          if [ -f "${sdk_archive}" ] && ! printf '%s  %s\n' "${SDK_SHA256}" "${sdk_archive}" | sha256sum -c -; then
            echo "::warning::Cached SDK checksum mismatch; downloading it again."
            rm -f "${sdk_archive}"
          fi

          if [ ! -f "${sdk_archive}" ]; then
            # Avoid HTTP/2 stream failures and retry interrupted downloads.
            # Only a checksum-verified archive may enter the SDK cache.
            curl --http1.1 -fL --retry 5 --retry-all-errors \
              --connect-timeout 30 --max-time 1800 \
              "${SDK_BASE_URL}/${SDK_FILE}" -o "${sdk_partial}"
            printf '%s  %s\n' "${SDK_SHA256}" "${sdk_partial}" | sha256sum -c -
            mv "${sdk_partial}" "${sdk_archive}"
          fi

          mkdir -p sdk
          case "${SDK_FILE}" in
            *.tar.zst)
              tar --zstd -xf "${sdk_archive}" -C sdk --strip-components=1
              ;;
            *.tar.xz)
              tar -xJf "${sdk_archive}" -C sdk --strip-components=1
              ;;
            *)
              echo "::error::Unsupported SDK archive: ${SDK_FILE}"
              exit 1
              ;;
          esac

      - name: Prepare OpenWrt feeds
        working-directory: sdk
        run: |
          cp feeds.conf.default feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Prepare local packages
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.apk_version }}
          PACKAGE_RELEASE: ${{ needs.metadata.outputs.package_release }}
          NUXLAB_UPDATE_PRIMARY_URL: ${{ vars.NUXLAB_UPDATE_PRIMARY_URL }}
          NUXLAB_UPDATE_FALLBACK_URL: ${{ vars.NUXLAB_UPDATE_FALLBACK_URL }}
        run: |
          mkdir -p sdk/package

          rsync -a --delete \
            --exclude='.git' \
            --exclude='sdk' \
            --exclude='artifacts' \
            --exclude='/compat' \
            --exclude='/preview' \
            --exclude='/node_modules' \
            --exclude='/dist' \
            --exclude='/package.json' \
            --exclude='/package-lock.json' \
            --exclude='/tsconfig.json' \
            --exclude='/vite.config.ts' \
            --exclude='/index.html' \
            --exclude='/metadata.json' \
            "${GITHUB_WORKSPACE}/" \
            sdk/package/luci-theme-nuxlab/

          cp -a compat/luci-app-nuxlab sdk/package/luci-app-nuxlab

          python3 .github/scripts/generate_update_site.py sources \
            --primary "$NUXLAB_UPDATE_PRIMARY_URL" \
            --fallback "${NUXLAB_UPDATE_FALLBACK_URL:-https://xlucky0.github.io/NuxLab-Theme/updates/stable.json}" \
            --output sdk/package/luci-theme-nuxlab/root/usr/share/nuxlab/update-sources.json

          for makefile in \
            sdk/package/luci-theme-nuxlab/Makefile \
            sdk/package/luci-app-nuxlab/Makefile
          do
            sed -i -E "s/^(PKG_VERSION):=.*/\1:=${RELEASE_VERSION}/" "${makefile}"
            sed -i -E "s/^(PKG_RELEASE):=.*/\1:=${PACKAGE_RELEASE}/" "${makefile}"
          done

      - name: Configure packages
        working-directory: sdk
        run: |
          cat > .config <<'EOF'
          CONFIG_ALL_NONSHARED=n
          CONFIG_ALL_KMODS=n
          CONFIG_ALL=n
          CONFIG_AUTOREMOVE=n
          CONFIG_PACKAGE_luci-theme-nuxlab=m
          CONFIG_PACKAGE_luci-app-nuxlab=m
          EOF

          sed -i 's/^[[:space:]]*//' .config

          python3 - <<'PY'
          import re
          from pathlib import Path

          luci_mk = Path('feeds/luci/luci.mk').read_text()
          supported = set(re.findall(r'^LUCI_LANG\.([A-Za-z0-9_]+)=', luci_mk, re.M))
          aliases = dict(re.findall(r'^LUCI_LC_ALIAS\.([A-Za-z0-9_]+)=(\S+)', luci_mk, re.M))
          languages = sorted({po.parent.name for po in Path('package/luci-theme-nuxlab/po').glob('*/*.po')
                              if po.parent.name != 'en'})

          if not languages:
              raise SystemExit('::error::No NuxLab configuration translations found.')
          unsupported = set(languages) - supported
          if unsupported:
              raise SystemExit(f'::error::Unsupported translation directories: {", ".join(sorted(unsupported))}')

          with Path('.config').open('a') as config, Path('../nuxlab-i18n-packages.txt').open('w') as manifest:
              for language in languages:
                  package = f'luci-i18n-nuxlab-{aliases.get(language, language)}'
                  config.write(f'CONFIG_LUCI_LANG_{language}=y\nCONFIG_PACKAGE_{package}=m\n')
                  manifest.write(f'{package}\n')
                  print(f'Enable translation: {language} -> {package}')
          PY

          make defconfig

          while IFS= read -r package; do
            if ! grep -Fxq "CONFIG_PACKAGE_${package}=m" .config; then
              echo "::error::Translation package was not enabled by defconfig: ${package}"
              exit 1
            fi
          done < ../nuxlab-i18n-packages.txt

      - name: Compile packages
        working-directory: sdk
        env:
          OPENWRT_PRIV_KEY: ${{ secrets.OPENWRT_PRIV_KEY }}
          OPENWRT_PUB_KEY: ${{ secrets.OPENWRT_PUB_KEY }}
        run: |
          set -eu
          umask 077
          key_dir="${RUNNER_TEMP}/nuxlab-apk-keys"
          private_key="${key_dir}/private.pem"
          public_key="${key_dir}/public.pem"
          mkdir -p "${key_dir}"
          trap 'rm -rf "${key_dir}"' EXIT HUP INT TERM
          : "${OPENWRT_PRIV_KEY:?OPENWRT_PRIV_KEY is required for signed APK releases}"
          : "${OPENWRT_PUB_KEY:?OPENWRT_PUB_KEY is required for signed APK releases}"
          printf '%s\n' "${OPENWRT_PRIV_KEY}" > "${private_key}"
          printf '%s\n' "${OPENWRT_PUB_KEY}" > "${public_key}"
          chmod 600 "${private_key}" "${public_key}"

          openssl pkey -in "${private_key}" -pubout -outform DER -out "${key_dir}/derived.der"
          openssl pkey -pubin -in "${public_key}" -outform DER -out "${key_dir}/provided.der"
          cmp "${key_dir}/derived.der" "${key_dir}/provided.der"

          python3 - <<'PY'
          from pathlib import Path

          path = Path('include/package-pack.mk')
          source = path.read_text()
          needle = '  --files "$$(IDIR_$(1))" \\\n'
          replacement = '  $$(if $$(APK_SIGN_KEY),--sign-key "$$(APK_SIGN_KEY)") \\\n' + needle
          if source.count(needle) != 1:
              raise SystemExit('Unable to safely add APK signing to the SDK package recipe.')
          path.write_text(source.replace(needle, replacement))
          PY

          export APK_SIGN_KEY="${private_key}"
          make package/luci-theme-nuxlab/clean package/luci-app-nuxlab/clean
          make package/luci-theme-nuxlab/compile -j"$(nproc)" V=s
          make package/luci-app-nuxlab/compile -j"$(nproc)" V=s

      - name: Collect packages
        env:
          PACKAGE_FORMAT: ${{ matrix.package_format }}
        run: |
          mkdir -p "artifacts/${PACKAGE_FORMAT}"

          find sdk/bin/packages -type f \
            \( -name "luci-theme-nuxlab-*.apk" \
            -o -name "luci-app-nuxlab-*.apk" \
            -o -name "luci-i18n-nuxlab-*.apk" \) \
            -exec cp -v {} "artifacts/${PACKAGE_FORMAT}/" \;

          theme_count="$(find "artifacts/${PACKAGE_FORMAT}" -maxdepth 1 -type f -name "luci-theme-nuxlab-*.apk" | wc -l)"
          config_count="$(find "artifacts/${PACKAGE_FORMAT}" -maxdepth 1 -type f -name "luci-app-nuxlab-*.apk" | wc -l)"

          missing_packages=0
          if [ "${theme_count}" -lt 1 ] || [ "${config_count}" -lt 1 ]; then
            echo "::error::Missing expected packages for ${PACKAGE_FORMAT} (theme=${theme_count}, config=${config_count})."
            missing_packages=1
          fi

          while IFS= read -r package; do
            pattern="${package}-*.apk"

            if ! find "artifacts/${PACKAGE_FORMAT}" -maxdepth 1 -type f -name "${pattern}" -print -quit | grep -q .; then
              echo "::error::Missing translation package for ${PACKAGE_FORMAT}: ${package}"
              missing_packages=1
            fi
          done < nuxlab-i18n-packages.txt

          if [ "${missing_packages}" -ne 0 ]; then
            find sdk/bin/packages -maxdepth 3 -type f | sort
            find "artifacts/${PACKAGE_FORMAT}" -maxdepth 1 -type f -print
            exit 1
          fi

      - name: Sign repository index and prepare public assets
        id: sign-apk-artifacts
        env:
          OPENWRT_PRIV_KEY: ${{ secrets.OPENWRT_PRIV_KEY }}
          OPENWRT_PUB_KEY: ${{ secrets.OPENWRT_PUB_KEY }}
          PACKAGE_FORMAT: ${{ matrix.package_format }}
        run: |
          set -eu
          umask 077
          key_dir="${RUNNER_TEMP}/nuxlab-apk-index-keys"
          private_key="${key_dir}/private.pem"
          public_key="${key_dir}/public.pem"
          mkdir -p "${key_dir}"
          trap 'rm -rf "${key_dir}"' EXIT HUP INT TERM
          : "${OPENWRT_PRIV_KEY:?OPENWRT_PRIV_KEY is required for signed APK releases}"
          : "${OPENWRT_PUB_KEY:?OPENWRT_PUB_KEY is required for signed APK releases}"
          printf '%s\n' "${OPENWRT_PRIV_KEY}" > "${private_key}"
          printf '%s\n' "${OPENWRT_PUB_KEY}" > "${public_key}"
          chmod 600 "${private_key}" "${public_key}"
          openssl pkey -in "${private_key}" -pubout -outform DER -out "${key_dir}/derived.der"
          openssl pkey -pubin -in "${public_key}" -outform DER -out "${key_dir}/provided.der"
          cmp "${key_dir}/derived.der" "${key_dir}/provided.der"

          apk_tool="${GITHUB_WORKSPACE}/sdk/staging_dir/host/bin/apk"
          artifact_dir="artifacts/${PACKAGE_FORMAT}"
          mkdir -p "${artifact_dir}"
          cp "${public_key}" "${artifact_dir}/nuxlab-apk.pem"
          cp install-key.sh "${artifact_dir}/install-key.sh"
          chmod 644 "${artifact_dir}/nuxlab-apk.pem" "${artifact_dir}/install-key.sh"

          "${apk_tool}" --keys-dir "${key_dir}" mkndx \
            --sign-key "${private_key}" \
            --output "${artifact_dir}/packages.adb" \
            "${artifact_dir}"/*.apk
          "${apk_tool}" --keys-dir "${key_dir}" verify "${artifact_dir}"/*.apk
          "${apk_tool}" --keys-dir "${key_dir}" verify "${artifact_dir}/packages.adb"

          fingerprint="$(sha256sum "${artifact_dir}/nuxlab-apk.pem" | awk '{print $1}')"
          printf 'fingerprint=%s\n' "${fingerprint}" >> "${GITHUB_OUTPUT}"
          printf 'APK public key SHA256: `%s`\n' "${fingerprint}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Verify translation package versions
        env:
          PACKAGE_FORMAT: ${{ matrix.package_format }}
          EXPECTED_VERSION: ${{ needs.metadata.outputs.apk_i18n_version }}
        run: |
          python3 .github/scripts/check_translation_versions.py \
            --format "${PACKAGE_FORMAT}" \
            --directory "artifacts/${PACKAGE_FORMAT}" \
            --manifest nuxlab-i18n-packages.txt \
            --expected-version "${EXPECTED_VERSION}" \
            --apk-tool "${GITHUB_WORKSPACE}/sdk/staging_dir/host/bin/apk"

      - name: Verify packages are architecture independent
        env:
          PACKAGE_FORMAT: ${{ matrix.package_format }}
        run: |
          python3 .github/scripts/check_apk_architecture.py \
            --directory "artifacts/${PACKAGE_FORMAT}" \
            --apk-tool "${GITHUB_WORKSPACE}/sdk/staging_dir/host/bin/apk"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.package_format }}
          path: artifacts/${{ matrix.package_format }}/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs: [build, metadata, verify-apk]
    permissions:
      contents: write
    outputs:
      apk_fingerprint: ${{ needs.build.outputs.apk_fingerprint }}
    steps:
      - name: Checkout release installation notes
        uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: packages-*
          merge-multiple: true

      - name: Add the APK key fingerprint to release notes
        env:
          APK_FINGERPRINT: ${{ needs.build.outputs.apk_fingerprint }}
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
        run: |
          body=".github/release-installation.md"
          if [ "${PRERELEASE}" = "true" ]; then
            body=".github/release-preview.md"
          fi
          cp "${body}" release-body.md
          {
            printf '\n## APK signing key\n\n'
            printf 'SHA256 of `nuxlab-apk.pem`: `%s`\n' "${APK_FINGERPRINT}"
            printf '\nVerify this fingerprint before installing the public key on a router.\n'
          } >> release-body.md

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-body.md
          prerelease: ${{ needs.metadata.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.metadata.outputs.prerelease == 'true' && 'false' || 'true' }}
          generate_release_notes: ${{ needs.metadata.outputs.prerelease == 'false' }}
          fail_on_unmatched_files: true
          files: release-assets/*

  verify-apk:
    name: Verify signed APKs on OpenWrt 25.12 (${{ matrix.arch }})
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            platform: linux/amd64
            rootfs_url: https://downloads.openwrt.org/releases/25.12.5/targets/x86/64/openwrt-25.12.5-x86-64-rootfs.tar.gz
          - arch: aarch64
            platform: linux/arm64
            rootfs_url: https://downloads.openwrt.org/releases/25.12.5/targets/armsr/armv8/openwrt-25.12.5-armsr-armv8-rootfs.tar.gz
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: packages-apk
          path: packages

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Download official OpenWrt rootfs
        env:
          ROOTFS_URL: ${{ matrix.rootfs_url }}
        run: |
          curl --http1.1 -fL --retry 5 --retry-all-errors \
            --connect-timeout 30 --max-time 600 \
            "${ROOTFS_URL}" -o "${RUNNER_TEMP}/openwrt-rootfs.tar.gz"

      - name: Test local install, rejection cases and signed feed
        run: |
          sh .github/scripts/verify_apk_rootfs.sh \
            packages "${RUNNER_TEMP}/openwrt-rootfs.tar.gz" "${{ matrix.platform }}"

  sync-docs:
    name: Sync release docs
    runs-on: ubuntu-24.04
    needs: [release, metadata]
    if: needs.metadata.outputs.prerelease == 'false'
    steps:
      - name: Checkout release documentation branch
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.docs_branch }}
          fetch-depth: 0

      - name: Update README and changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export RELEASE_DATE="$(TZ='${{ env.TZ }}' date +%Y.%m.%d)"
          export PKG_RELEASE_DATE="$(TZ='${{ env.TZ }}' date +%Y%m%d)"
          bash .github/scripts/update_release_docs.sh "${GITHUB_REF_NAME}"

      - name: Commit updated docs
        env:
          DOCS_BRANCH: ${{ needs.metadata.outputs.docs_branch }}
        run: |
          if git diff --quiet -- Makefile compat/luci-app-nuxlab/Makefile README.md README_ZH.md RELEASE.md RELEASE_ZH.md; then
            echo "No documentation updates to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Makefile compat/luci-app-nuxlab/Makefile README.md README_ZH.md RELEASE.md RELEASE_ZH.md
          git commit -m "docs: sync release notes for ${GITHUB_REF_NAME}"
          git push origin "HEAD:${DOCS_BRANCH}"

  publish-apk-feed:
    name: Publish the signed APK feed
    needs: release
    uses: ./.github/workflows/publish_updates.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
